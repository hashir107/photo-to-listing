name: validate

# Validates the shared skill and builds the release packages as workflow artifacts.
# It never publishes a GitHub Release or submits anything to a marketplace.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Source validation (standard library only)
        run: python3 scripts/validate.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install cross-check validators
        run: |
          python3 -m pip install "jsonschema==4.26.0" \
            "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validation with jsonschema and skills-ref
        run: python3 scripts/validate.py --external

      - name: Build release packages
        run: python3 scripts/build_releases.py

      - name: Verify built packages
        run: |
          python3 scripts/validate.py --dist dist
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photo-to-listing-packages
          path: dist/
          if-no-files-found: error
